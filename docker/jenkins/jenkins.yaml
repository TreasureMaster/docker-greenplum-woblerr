jenkins:
  systemMessage: "Jenkins настроен через Configuration as Code"

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false
  scriptApproval:
      approvedSignatures:
        - "method org.jenkinsci.plugins.workflow.support.actions.EnvironmentAction getEnvironment"

  # securityRealm:
  #   local:
  #     allowsSignup: false
  #     users:
  #       - id: "admin"
  #         password: "admin-password"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "cdjksnd"
              username: "cdjks_user"
              password: "jkspass123"
              description: "Учетка для доступа к GitLab"
          - usernamePassword:
              scope: GLOBAL
              id: "adb-prod-admin"
              username: "admin_user"
              password: "jkspass123"
              description: "Учетка для доступа к ADB"

jobs:
  - script: |
      folder('DWH_GP') {}
      folder('DWH_GP/internal_manual') {}

      pipelineJob('DWH_GP/internal_manual/jks-automatic-all-adb-prod') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${GITLAB_DWH_URL}/DWH/ADB/service-projects/automation/jks-liquibase-all.git')
                  credentials('cdjksnd')
                }
                branches('*/master')
              }
            }
            scriptPath('pipelines-prod/Jenkinsfile-all-adb-prod')
          }
        }
      }

      pipelineJob('DWH_GP/internal_manual/jks-automatic-deploy-adb-prod') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${GITLAB_DWH_URL}/DWH/ADB/service-projects/automation/jks-liquibase-all.git')
                  credentials('cdjksnd')
                }
                branches('*/master')
              }
            }
            scriptPath('pipelines-prod/Jenkinsfile-deploy-adb-prod')
          }
        }
      }
