[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
loglevel=info

[program:winbindd]
# command=/usr/sbin/winbindd -F --no-process-group
command=/usr/sbin/winbindd -D
autostart=true
autorestart=true
stdout_logfile=/var/log/winbindd.log
stderr_logfile=/var/log/winbindd.err

[program:apache]
command=/usr/sbin/httpd -D FOREGROUND
autostart=true
autorestart=true
stdout_logfile=/var/log/apache2/supervisor.log
stderr_logfile=/var/log/apache2/supervisor.err
