[supervisord]
nodaemon=true
pidfile=/var/run/supervisord.pid
logfile=/var/log/supervisord.log
# Возвращаем info, чтобы логи не забивались отладочным мусором
loglevel=info

[program:winbindd]
command=/usr/sbin/winbindd -F --no-process-group --debug-stdout
autostart=true
# Включаем автоматический перезапуск, если падение было случайным
autorestart=true
startsecs=3
startretries=3
priority=10
stdout_logfile=/var/log/winbindd.log
stderr_logfile=/var/log/winbindd.err
stopsignal=TERM

[program:apache]
command=/usr/sbin/httpd -D FOREGROUND
autostart=true
autorestart=true
startsecs=3
startretries=3
priority=20
stdout_logfile=/var/log/apache2/supervisor.log
stderr_logfile=/var/log/apache2/supervisor.err
stopsignal=TERM

# АВТО-ПАДЕНИЕ КОНТЕЙНЕРА ПРИ ОШИБКЕ СЕРВИСОВ:
# Этот слушатель событий следит за состоянием winbindd и apache. 
# Если какой-то из них переходит в состояние падения (BACKOFF/FATAL/EXITED),
# скрипт выполняет kill главного процесса supervisord, завершая весь контейнер.
[eventlistener:exit_on_failure]
# command=bash -c "while read line; do kill -SIGTERM $(cat /var/run/supervisord.pid); done"
command=bash -c "while true; do echo 'READY'; read -r line; kill -SIGTERM 1; echo 'RESULT 2'; echo 'OK'; done"
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED,PROCESS_STATE_UNKNOWN
priority=100

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
