services:
  local-registry:
    image: registry:3.0.0
    container_name: local-registry
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
      - ./registry-config.yml:/etc/docker/registry/config.yml:ro
    networks:
      - offline-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/v2/"]
      interval: 5s
      timeout: 2s
      retries: 5

  registry-seeder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CRANE_ENABLED: "true"  # или "false"
    container_name: registry-seeder
    depends_on:
      local-registry:
        condition: service_healthy
    environment:
      - REGISTRY_HOST=host.docker.internal
      - REGISTRY_PORT=5000
      - IMAGES_DIR=/opt/offline-images
      - MODE=safe
      - CRANE_ENABLED=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - offline-net
    restart: "no"

volumes:
  registry_data:

networks:
  offline-net:
    driver: bridge
