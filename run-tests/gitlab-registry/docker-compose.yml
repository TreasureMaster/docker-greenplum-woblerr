  registry:
    image: registry:3.0.0
    container_name: ${REGISTRY_CONTAINER_NAME}
    hostname: ${REGISTRY_HOSTNAME}
    # restart: always
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: true
      REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
      # отключить OpenTelemetry
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      REGISTRY_LOG_LEVEL: info
    ports:
      - "${REGISTRY_HOST_PORT}:5000"   # опционально, если нужно с хоста
    volumes:
      - registry-data:/var/lib/registry
      # проброс не нужен. Это как пример
      # - ./config/config.yml:/etc/distribution/config.yml
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/v2/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - registry-net
      - dwh-net

  registry-ui:
    image: joxit/docker-registry-ui:2.6.0
    container_name: registry-ui
    restart: always
    ports:
      - "8082:80"
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=Local Docker Registry
      - NGINX_PROXY_PASS_URL=http://${REGISTRY_HOSTNAME}:5000
      - REGISTRY_SECURED=false
    depends_on:
      - registry
    networks:
      - registry-net

  dwh-init:
    image: dwh-init:0.3.4
    container_name: dwh-init
    depends_on:
      registry:
        condition: service_healthy
      gitlab:
        condition: service_healthy
    environment:
      - REGISTRY_HOST=${REGISTRY_HOSTNAME}
      - REGISTRY_PORT=5000
      - IMAGES_DIR=/opt/offline-images
      - MODE=safe
    env_file:
      - .env
    volumes:
      - gitlab-bootstrap:/shared/bootstrap
    networks:
      - registry-net
      - dwh-net
    # restart: "no"

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  jenkins_home:
  registry-data:
  gitlab-bootstrap:

networks:
  dwh-net:
    driver: bridge
  registry-net:
    driver: bridge
