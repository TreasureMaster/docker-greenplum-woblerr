# version: "3.9"

services:
  registry:
    image: registry:3.0.0
    container_name: ${REGISTRY_CONTAINER_NAME}
    hostname: ${REGISTRY_HOSTNAME}
    # restart: always
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: true
      REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
      # отключить OpenTelemetry
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      REGISTRY_LOG_LEVEL: info
    ports:
      - "${REGISTRY_HOST_PORT}:5000"   # опционально, если нужно с хоста
    volumes:
      - registry-data:/var/lib/registry
      # проброс не нужен. Это как пример
      # - ./config/config.yml:/etc/distribution/config.yml
    networks:
      - registry-net

  registry-ui:
    image: joxit/docker-registry-ui:2.6.0
    container_name: registry-ui
    restart: always
    ports:
      - "8080:80"
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=Local Docker Registry
      - NGINX_PROXY_PASS_URL=http://${REGISTRY_HOSTNAME}:5000
      - REGISTRY_SECURED=false
    depends_on:
      - registry
    networks:
      - registry-net

  # пример другого сервиса, который будет видеть registry по имени:
  # app:
  #   image: alpine
  #   command: ["sleep", "infinity"]
  #   networks:
  #     - registry-net
  #   environment:
  #     REGISTRY_HOSTNAME: ${REGISTRY_HOSTNAME:-registry.local}:5000

networks:
  registry-net:

volumes:
  registry-data:
