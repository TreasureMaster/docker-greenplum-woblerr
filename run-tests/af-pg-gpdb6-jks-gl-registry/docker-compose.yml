services:

  master:
    image: ${IMAGE_NAME}:${TAG}
    container_name: master
    hostname: ${GREENPLUM_HOSTNAME}
    ports:
      - "${EXPOSE_MASTER_PORT}:5432"
    environment:
      - GREENPLUM_DATABASE_NAME=${GREENPLUM_DATABASE_NAME}
      - GREENPLUM_USER=${GREENPLUM_USER}
      - GREENPLUM_PXF_BASE_DIRECTORY=${GREENPLUM_PXF_BASE_DIRECTORY}
      - GREENPLUM_DEPLOYMENT=singlenode
      - GREENPLUM_START_DEBUG=true
      - GREENPLUM_GPPERFMON_ENABLE=true
      - GREENPLUM_DISKQUOTA_ENABLE=true
      - GREENPLUM_PXF_ENABLE=true
      - GREENPLUM_PASSWORD_FILE=${GREENPLUM_SECRETS_DIR}/gpdb_password
      - GREENPLUM_GPMON_PASSWORD_FILE=${GREENPLUM_SECRETS_DIR}/gpmon_password
      - ADB_DEPLOY_CDJKS_PASSWORD=${ADB_DEPLOY_CDJKS_PASSWORD}
      - ADB_EXEC_DWH_PASSWORD=${ADB_EXEC_DWH_PASSWORD}
      - ADB_DEPLOY_PASSWORD=${ADB_DEPLOY_PASSWORD}
      - JENKINS_SSH_USER=${JENKINS_SSH_USER}
      - JENKINS_SSH_PASS=${JENKINS_SSH_PASS}
    volumes:
      - gpdb-master-data:/data
      # - ../docs/custom_init_scripts:/docker-entrypoint-initdb.d
      # - ./conf/${CONFIG_FOLDER}/gpinitsystem_config_singlenode:/tmp/gpinitsystem_config
      # - ./conf/hostlist_singlenode:/tmp/hostfile_gpinitsystem
      # - gpdb-config:/tmp/gpinitsystem_config:ro,subpath=gpinitsystem_config
      # - gpdb-config:/tmp/hostfile_gpinitsystem:ro,subpath=hostfile_gpinitsystem
      - gpdb-config:/tmp/gptempcfg:ro
      - gpdb-secrets:${GREENPLUM_SECRETS_DIR}:ro
      - gpdb-pxf:/tmp/pxf:ro
      - gpdb-init:/docker-entrypoint-initdb.d:ro
      # - ./conf/pxf:/tmp/pxf
      # - ./conf/ssh/id_rsa:/home/gpadmin/.ssh/id_rsa
      # - ./conf/ssh/id_rsa.pub:/home/gpadmin/.ssh/id_rsa.pub
    depends_on:
      dwh-init:
        condition: service_started
      gitlab:
        condition: service_healthy
    networks:
      dwh-net:
        ipv4_address: ${MASTER_IP}

  postgres:
    image: ${POSTGRES_IMAGE_NAME}:${POSTGRES_TAG}
    container_name: postgres
    hostname: postgres
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # - POSTGRES_DB=${AFPROD_BASE_DB}
    # env_file:
    #   - ./pg-conf/initdb/.env.pxf
    volumes:
      - pgdb-conflog-data:/var/lib/postgresql/data
      - pgdb-init:/docker-entrypoint-initdb.d:ro
      - pgdb-preinit:/docker-entrypoint-preinit.d:ro
      # - ./pg-conf/initdb:/docker-entrypoint-initdb.d
    ports:
      - "${EXPOSE_POSTGRES_PORT}:5432"
    depends_on:
      dwh-init:
        condition: service_started
      gitlab:
        condition: service_healthy
    networks:
      dwh-net:
        ipv4_address: ${POSTGRES_IP}

  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION}
    container_name: ${GITLAB_CONTAINER_NAME}
    hostname: ${GITLAB_HOSTNAME}
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # Базовая настройка
        external_url 'http://${GITLAB_HOSTNAME}'
        gitlab_rails['initial_root_password'] = '${INITIAL_ROOT_PASSWORD}'
        prometheus_monitoring['enable'] = false
        
        # CPU/RAM оптимизация
        puma['worker_processes'] = 2
        puma['worker_max_memory'] = 1024
        sidekiq['concurrency'] = 10
        
        # Postgres tuning (критично!)
        postgresql['shared_buffers'] = "1GB"
        postgresql['effective_cache_size'] = "3GB"
        postgresql['work_mem'] = "16MB"
        postgresql['maintenance_work_mem'] = "512MB"
        postgresql['checkpoint_completion_target'] = 0.9
        postgresql['default_statistics_target'] = 100
        
        # Redis
        redis['maxmemory'] = '1gb'
        redis['maxmemory_policy'] = 'allkeys-lru'
        
        # Отключить тяжелые cron на старте
        sidekiq['timeout'] = 30
      GITLAB_POST_RECONFIGURE_SCRIPT: |
        chown -R git:git /shared/bootstrap || true
        chmod 700 /shared/bootstrap || true
        /opt/gitlab/bin/gitlab-rails runner /shared/bootstrap/create-root-pat.rb
    ports:
      - '${GITLAB_EXTERNAL_PORT}:80'
      - '8443:443'
      - '2222:22'
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
      - ./gitlab-rails-init:/usr/local/bin/gitlab-rails-init:ro
      - gitlab-bootstrap:/shared/bootstrap
      - ./gitlab-bootstrap/create-root-pat.rb:/shared/bootstrap/create-root-pat.rb:ro
    shm_size: '1gb'
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: ${START_PERIOD}s
    networks:
      dwh-net:
        ipv4_address: ${GITLAB_IP}
    # restart: always

  jenkins:
    image: treasuremaster/jenkins:${JENKINS_VERSION}
    container_name: ${JENKINS_CONTAINER_NAME}
    hostname: ${JENKINS_URL}
    ports:
      - "${JENKINS_EXTERNAL_PORT}:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # - ./init.groovy.d:/usr/share/jenkins/ref/init.groovy.d
      # - ./jenkins.yaml:/var/jenkins_home/jenkins.yaml
    environment:
      JENKINS_URL: http://${JENKINS_URL}:8080/
      GITLAB_DWH_URL: http://${GITLAB_HOSTNAME}:${GITLAB_PORT}
      START_ADMIN_USERNAME: ${START_ADMIN_USERNAME}
      START_ADMIN_PASSWORD: ${START_ADMIN_PASSWORD}
      CASC_JENKINS_CONFIG: /var/jenkins_home/jenkins.yaml
    env_file:
      - .env
    depends_on:
      gitlab:
        condition: service_healthy
    networks:
      dwh-net:
        ipv4_address: ${JENKINS_IP}

  registry:
    image: registry:3.0.0
    container_name: ${REGISTRY_CONTAINER_NAME}
    hostname: ${REGISTRY_HOSTNAME}
    # restart: always
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: true
      REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
      # отключить OpenTelemetry
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      REGISTRY_LOG_LEVEL: info
    ports:
      - "${REGISTRY_EXTERNAL_PORT}:5000"   # опционально, если нужно с хоста
    volumes:
      - registry-data:/var/lib/registry
      # проброс не нужен. Это как пример
      # - ./config/config.yml:/etc/distribution/config.yml
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/v2/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      registry-net:
        ipv4_address: ${REGISTRY_IP}
      dwh-net:
        ipv4_address: ${DWH_REGISTRY_IP}

  registry-ui:
    image: joxit/docker-registry-ui:2.6.0
    container_name: registry-ui
    restart: always
    ports:
      - "8082:80"
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=DWH Docker Registry
      - NGINX_PROXY_PASS_URL=http://${REGISTRY_URL}
      - REGISTRY_SECURED=false
    depends_on:
      - registry
    networks:
      registry-net:
        ipv4_address: ${REGISTRY_UI_IP}

  redis:
    image: ${REDIS_IMAGE_NAME}:${REDIS_TAG}
    container_name: redis
    hostname: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    depends_on:
      dwh-init:
        condition: service_started
      gitlab:
        condition: service_healthy
    networks:
      airflow-tier:
        ipv4_address: ${AIRFLOW_REDIS_IP}

  airflow-webserver:
    image: ${AF_WEB_IMAGE}:${AF_WEB_TAG}
    container_name: airflow-webserver
    volumes:
      - af_data:/opt/bitnami/airflow
      - af-preinit:/docker-entrypoint-preinit.d:ro
      # - '/opt/bitnami/airflow/dags:/opt/bitnami/airflow/dags'
      # - '/opt/bitnami/airflow/logs:/opt/bitnami/airflow/logs/'
      # - '/opt/bitnami/airflow/plugins:/opt/bitnami/airflow/plugins'
    environment:
      # BITNAMI_DEBUG: true
      # secrets
      AIRFLOW_FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW_SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      # postgres
      AIRFLOW_DATABASE_HOST: ${AIRFLOW_DATABASE_HOST}
      AIRFLOW_DATABASE_NAME: ${POSTGRESQL_DATABASE}
      AIRFLOW_DATABASE_USERNAME: ${POSTGRESQL_USERNAME}
      AIRFLOW_DATABASE_PASSWORD: ${POSTGRESQL_PASSWORD}
      # redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # airflow common
      AIRFLOW_EXECUTOR: ${AIRFLOW_EXECUTOR}
      AIRFLOW_LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW_WEBSERVER_HOST: ${AIRFLOW_WEBSERVER_HOST}
      AIRFLOW_BASE_URL: S{AIRFLOW_BASE_URL}
      AIRFLOW__WEBSERVER__BASE_URL: ${AIRFLOW__WEBSERVER__BASE_URL}
      # default: 16
      # AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 32
      # airflow webserver
      AIRFLOW__CORE__TEST_CONNECTION: Enabled
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME}
      AIRFLOW_EMAIL: user@example.com
      # default: 4
      # AIRFLOW__WEBSERVER__WORKERS: 9
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth, airflow.api.auth.backend.session
      # ldap
      # smtp
    hostname: ${AIRFLOW_WEBSERVER_HOST}
    ports:
      - 8080:8080
    depends_on:
      dwh-init:
        condition: service_started
      gitlab:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      dwh-net:
        ipv4_address: ${DWH_AIRFLOW_WEBSERVER_IP}
      airflow-tier:
        ipv4_address: ${AIRFLOW_WEBSERVER_IP}

  airflow-scheduler:
    image: ${AF_SCH_IMAGE}:${AF_SCH_TAG}
    container_name: airflow-scheduler
    volumes:
      - af_data:/opt/bitnami/airflow
      - af-preinit:/docker-entrypoint-preinit.d:ro
      # - '/opt/bitnami/airflow/dags:/opt/bitnami/airflow/dags'
      # - '/opt/bitnami/airflow/logs:/opt/bitnami/airflow/logs/'
      # - '/opt/bitnami/airflow/plugins:/opt/bitnami/airflow/plugins'
      # - '/etc/pki/ca-trust/source/anchors/:/usr/local/share/ca-certificates/'
    environment:
      # BITNAMI_DEBUG: true
      # secrets
      AIRFLOW_FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW_SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      # postgres
      AIRFLOW_DATABASE_HOST: ${AIRFLOW_DATABASE_HOST}
      AIRFLOW_DATABASE_NAME: ${POSTGRESQL_DATABASE}
      AIRFLOW_DATABASE_USERNAME: ${POSTGRESQL_USERNAME}
      AIRFLOW_DATABASE_PASSWORD: ${POSTGRESQL_PASSWORD}
      # redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # airflow common
      AIRFLOW_WEBSERVER_HOST: ${AIRFLOW_WEBSERVER_HOST}
      AIRFLOW_EXECUTOR: ${AIRFLOW_EXECUTOR}
      AIRFLOW_LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      # default: 16
      # AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 32
      # smtp
    hostname: airflow-scheduler
    depends_on:
      dwh-init:
        condition: service_started
      gitlab:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_started
      airflow-webserver:
        condition: service_started
    networks:
      dwh-net:
        ipv4_address: ${DWH_AIRFLOW_SCHEDULER_IP}
      airflow-tier:
        ipv4_address: ${AIRFLOW_SCHEDULER_IP}

  airflow-worker01:
    image: ${AF_WORKER_IMAGE}:${AF_WORKER_TAG}
    container_name: airflow-worker01
    volumes:
      - af_data:/opt/bitnami/airflow
      - af-preinit:/docker-entrypoint-preinit.d:ro
      # - '/opt/bitnami/airflow/dags:/opt/bitnami/airflow/dags'
      # - '/opt/bitnami/airflow/logs:/opt/bitnami/airflow/logs/'
      # - '/opt/bitnami/airflow/plugins:/opt/bitnami/airflow/plugins'
      # - '/etc/pki/ca-trust/source/anchors/:/usr/local/share/ca-certificates/'
    environment:
      # BITNAMI_DEBUG: true
      # secrets
      AIRFLOW_FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW_SECRET_KEY: ${AIRFLOW_FERNET_KEY}
      # postgres
      AIRFLOW_DATABASE_HOST: ${AIRFLOW_DATABASE_HOST}
      AIRFLOW_DATABASE_NAME: ${POSTGRESQL_DATABASE}
      AIRFLOW_DATABASE_USERNAME: ${POSTGRESQL_USERNAME}
      AIRFLOW_DATABASE_PASSWORD: ${POSTGRESQL_PASSWORD}
      # redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # airflow common
      AIRFLOW_EXECUTOR: ${AIRFLOW_EXECUTOR}
      AIRFLOW_LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
      AIRFLOW_WEBSERVER_HOST: ${AIRFLOW_WEBSERVER_HOST}
      AIRFLOW__WEBSERVER__BASE_URL: ${AIRFLOW__WEBSERVER__BASE_URL}
      AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: 8793
      # default: 16
      # AIRFLOW__CELERY__WORKER_CONCURRENCY: 8
      AIRFLOW_QUEUE: default,trgrctrl,di,bdv_fast
      # smtp
    hostname: airflow-worker01
    expose:
      - 8793
    depends_on:
      dwh-init:
        condition: service_started
      gitlab:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_started
      airflow-webserver:
        condition: service_started
      airflow-scheduler:
        condition: service_started
    networks:
      dwh-net:
        ipv4_address: ${DWH_AIRFLOW_WORKER01_IP}
      airflow-tier:
        ipv4_address: ${AIRFLOW_WORKER01_IP}

  dwh-init:
    image: dwh-init:0.12.7
    container_name: dwh-init
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "100m"
    #     max-file: "5"
    depends_on:
      registry:
        condition: service_healthy
      gitlab:
        condition: service_healthy
    environment:
      - IMAGES_DIR=/opt/offline-images
      - MODE=safe
    env_file:
      - .env
    volumes:
      - gitlab-bootstrap:/shared/bootstrap
      - gpdb-config:/init/gpconf
      - gpdb-secrets:/init/gpsecrets
      - gpdb-pxf:/init/pxf
      - gpdb-init:/init/docker-entrypoint-gpinit
      - pgdb-init:/init/initdb
      - pgdb-preinit:/init/preinitdb
      - af-preinit:/init/af-preinit
    networks:
      registry-net:
        ipv4_address: ${REG_DWH_INIT_IP}
      dwh-net:
        ipv4_address: ${DWH_INIT_IP}
    # restart: "no"

  ntlm-server:
    image: treasuremaster/webdav-ntlm:0.1.5-alpine
    container_name: ntlm-server
    hostname: ntlm-server
    # ports:
    #   - "80:80"
    environment:
      - NTLM_USER=${NTLM_USER}
      - NTLM_PASSWORD=${NTLM_PASSWORD}  # Задайте ваш пароль
    volumes:
      - webdav-ntlm:/var/www/webdav
    depends_on:
      - dwh-init
    # restart: always
    networks:
      dwh-net:
        ipv4_address: ${NTLM_SERVER_IP}

  samba-share:
    image: dockurr/samba:4.23.8
    container_name: samba_server
    ports:
      - "445:445"
    environment:
      # --- ШАРА 1: Общая папка для Jenkins и Аналитиков ---
      - NAME=information
      - USER=${NTLM_USER}
      - PASS=${NTLM_PASSWORD}

      # --- Пользователь apache для доступа из webdav-ntlm
      - UID=82
      - GID=82
    volumes:
      # Важно: монтируем папки из volume в соответствующие подкаталоги /storage
      - webdav-ntlm:/storage
    depends_on:
      - ntlm-server
    # restart: always
    # networks:
    #   - dwh-net


volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  jenkins_home:
  registry-data:
  gitlab-bootstrap:
  gpdb-master-data:
  gpdb-config:
  gpdb-secrets:
  gpdb-pxf:
  gpdb-init:
  pgdb-conflog-data:
  pgdb-init:
  pgdb-preinit:
  redis_data:
  af_data:
  af-preinit:
  webdav-ntlm:

# networks:
#   dwh-net:
#     name: "${DOCKER_NETWORK}"
#     driver: bridge
#   registry-net:
#     driver: bridge
#   airflow-tier:
#     driver: bridge

networks:
  dwh-net:
    name: "${DOCKER_NETWORK}"
    driver: bridge
    ipam:
      config:
        - subnet: ${DWH_NET_SUBNET}
          gateway: ${DWH_NET_GATEWAY}

  registry-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${REGISTRY_NET_SUBNET}
          gateway: ${REGISTRY_NET_GATEWAY}

  airflow-tier:
    driver: bridge
    ipam:
      config:
        - subnet: ${AIRFLOW_NET_SUBNET}
          gateway: ${AIRFLOW_NET_GATEWAY}
