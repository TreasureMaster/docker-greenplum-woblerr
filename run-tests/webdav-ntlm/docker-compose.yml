services:
  webdav-ntlm:
    # build: .
    image: dwh/webdav-ntlm:0.0.8-alpine
    container_name: webdav_ntlm_server
    ports:
      - "80:80"
    environment:
      - NTLM_USER=cdjks_s2t
      - NTLM_PASSWORD=password  # Задайте ваш пароль
    volumes:
      # - ./webdav-ntlm.conf:/etc/apache2/sites-enabled/000-default.conf:ro
      # - ./conf:/etc/apache2/sites-enabled:ro
      # - ./shared_excel_files:/var/www/webdav
      - webdav-ntlm:/var/www/webdav
    # restart: always

  # samba-share:
  #   image: dperson/samba
  #   container_name: samba_server
  #   ports:
  #     - "139:139"
  #     - "445:445"
  #   volumes:
  #     - ./shared_excel_files:/mnt/share
  #   command: >
  #     -u "cdjks_s2t;SecretWindowsPassword123" 
  #     -s "excel_share;/mnt/share;no;no;no;cdjks_s2t"
  #     -g "force user = www-data"
  #     -g "force group = www-data"
  #   restart: always
  #   depends_on:
